name: Deploy Dailo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Dailo
        env:
          APP_VERSION: 2.1.${{ github.run_number }}
        run: npm run build

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 1
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages"
          for delay in 0 2 4 8 12; do
            sleep "$delay"
            if artifact=$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') && [ -n "$artifact" ]; then
              exit 0
            fi
          done
          echo "::error::The uploaded Pages artifact did not become visible."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
