<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#dff3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#061727" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Reveal a shared Dailo V2 word game." />
    <link rel="icon" href="../assets/icon-lighthouse-192.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./assets/dark/install-icon-192.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="./replay.css?v=2.0.25" />
    <link rel="stylesheet" href="./night.css?v=2.0.25" />
    <title>Dailo V2 replay</title>
  </head>
  <body>
    <main class="replay-shell" id="replay-root">
      <header class="replay-header">
        <a href="./" class="replay-brand" aria-label="Dailo V2 home">
          <picture>
            <source srcset="./assets/dark/header-icon.webp" media="(prefers-color-scheme: dark)" />
            <img class="replay-icon" src="./assets/icon-home.png" alt="" />
          </picture>
          <img class="replay-wordmark" src="./assets/wordmark.png" alt="Dailo" />
        </a>
      </header>
      <section class="replay-content" aria-labelledby="replay-title">
        <h1 id="replay-title">A daily word, replayed.</h1>
        <p class="replay-meta" id="replay-meta"></p>
        <div class="replay-board" id="replay-board" aria-label="Color-coded guesses"></div>
        <button class="reveal-button" id="reveal-button" type="button">Reveal guessed letters</button>
        <p class="replay-error" id="replay-error" hidden>This replay link is invalid or incomplete.</p>
      </section>
      <p class="replay-version" aria-label="App version">v2.0.25 · preview</p>
    </main>
    <script defer src="./scripts/replay.js"></script>
  </body>
</html>
